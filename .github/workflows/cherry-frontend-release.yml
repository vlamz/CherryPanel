name: CherryPanel Frontend Release

on:
  push:
    tags:
      - 'cherry-v*'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        working-directory: client
        run: yarn install

      - name: Build frontend
        working-directory: client
        run: yarn build

      - name: Package dist as zip
        working-directory: client/frontend/dist
        run: |
          zip -r ../../../cherry-frontend.zip \
            index.html \
            favicon.png \
            favicon.ico \
            js/ \
            css/ \
            $(ls fonts/ 2>/dev/null && echo fonts/ || true) \
            $(ls assets/ 2>/dev/null && echo assets/ || true) \
            $(ls manifest.json 2>/dev/null || true)

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-frontend
          path: cherry-frontend.zip
          if-no-files-found: error

  build-backend:
    name: Build Backend (Linux amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install swag
        run: |
          wget -q https://github.com/swaggo/swag/releases/download/v1.16.4/swag_1.16.4_Linux_x86_64.tar.gz
          mkdir -p ~/go/bin
          tar -zxf swag*.tar.gz -C ~/go/bin
          rm -f swag*.tar.gz

      - name: Download Go modules
        run: go mod download

      - name: Generate Swagger docs
        run: ~/go/bin/swag init --pd --md . -o web/swagger -g web/loader.go

      - name: Build backend binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          go build -o cherry-pufferpanel -ldflags "-X 'github.com/pufferpanel/pufferpanel/v3.Hash=${{ github.sha }}' -X 'github.com/pufferpanel/pufferpanel/v3.Version=${{ github.ref_name }}'" -v github.com/pufferpanel/pufferpanel/v3/cmd

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-pufferpanel
          path: cherry-pufferpanel
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-backend ]
    permissions:
      contents: write

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: cherry-frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: cherry-pufferpanel

      - name: Mark backend binary executable
        run: chmod +x cherry-pufferpanel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CherryPanel ${{ github.ref_name }}"
          body: |
            ## CherryPanel ${{ github.ref_name }}

            Pre-built frontend and backend files. **No build tools required.**

            ### Frontend-only update (most releases)

            ```bash
            # 1. Download cherry-frontend.zip from this release
            # 2. Extract to a temp folder
            unzip cherry-frontend.zip -d /tmp/cherry

            # 3. Copy to your PufferPanel webroot (adjust path if needed)
            sudo cp -r /tmp/cherry/* /var/www/pufferpanel/

            # 4. Hard-refresh your browser: Ctrl+Shift+R
            ```

            ### Backend update (only needed when a release changes daemon/API behavior)

            ```bash
            # 1. Download cherry-pufferpanel from this release
            chmod +x cherry-pufferpanel

            # 2. Stop the service
            sudo systemctl stop pufferpanel

            # 3. Replace the binary (back up the old one first if you want a rollback path)
            sudo cp /usr/sbin/pufferpanel /usr/sbin/pufferpanel.bak
            sudo cp cherry-pufferpanel /usr/sbin/pufferpanel
            sudo chown root:root /usr/sbin/pufferpanel
            sudo chmod 755 /usr/sbin/pufferpanel

            # 4. Restart the service
            sudo systemctl start pufferpanel
            ```

            > Built for **Linux amd64** only. The database is never touched by either update.

            ### Features
            - Real-time player count for Minecraft, SRCDS/Unturned, Terraria, Factorio, Valheim, Zomboid, Eco, Vintage Story
            - Game-aware Kick / Ban buttons per player
            - Dashboard Start / Stop buttons
            - current/max format (e.g. `0/24`)
            - Cherry red branding + redesigned theme presets (Classic, Light, Dark Modern)
            - Full i18n support (English + Turkish)
            - Drag-and-drop file upload, file rename/move in the file manager
          files: |
            cherry-frontend.zip
            cherry-pufferpanel
          draft: false
          prerelease: false
